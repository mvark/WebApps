<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Cloud Identifier</title>
</head>

<body>

<h3>Cloud Identifier (Hugging Face)</h3>

<input type="file" id="image" accept="image/*">

<br><br>

<select id="model">
    <option value="Qwen/Qwen2.5-VL-72B-Instruct">
        Qwen2.5-VL-72B-Instruct
    </option>

    <option value="google/gemma-4-31B-it">
        Gemma 4
    </option>

    <option value="MiniMaxAI/MiniMax-M3">
        MiniMaxAI/MiniMax-M3
    </option>
</select>

<button id="identify">
Identify Cloud
</button>
<hr>

<div id="result"></div>
<script>
const HF_TOKEN = "hf_YOUR_HUGGINGFACE_TOKEN"; //replace your own HUGGING FACE TOKEN here

document.getElementById("identify").onclick = async () => {
    const file = document.getElementById("image").files[0];
    if (!file) {
        alert("Choose an image");
        return;
    }

    const reader = new FileReader();
    reader.onload = async () => {
        const base64 = reader.result.split(",")[1];

        // Get the currently selected model from the dropdown
        const selectedModel = document.getElementById("model").value;

        const response = await fetch(
            "https://router.huggingface.co/v1/chat/completions",
            {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + HF_TOKEN,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: selectedModel, // Use the selected model here
                    messages: [
                        {
                            role: "user",
                            content: [
                                {
                                    type: "text",
                                    text: `You are an expert meteorologist.
Identify the cloud according to the World Meteorological Organization International Cloud Atlas.
Return ONLY valid JSON.

{
    "genus":"",
    "species":"",
    "confidence":95,
    "weather":"",
    "reason":""
}`
                                },
                                {
                                    type: "image_url",
                                    image_url: {
                                        url: "data:" + file.type + ";base64," + base64
                                    }
                                }
                            ]
                        }
                    ]
                })
            }
        );

        const json = await response.json();
        let text = json.choices[0].message.content;
        text = text.replace(/```json/g, "").replace(/```/g, "").trim();
        const cloud = JSON.parse(text);

        const icons = {
            "Cirrus": "🪶",
            "Cirrostratus": "🌫️",
            "Cirrocumulus": "☁️",
            "Altostratus": "🌥️",
            "Altocumulus": "⛅",
            "Stratus": "☁️",
            "Stratocumulus": "🌤️",
            "Nimbostratus": "🌧️",
            "Cumulus": "☁️",
            "Cumulonimbus": "⛈️"
        };

        const icon = icons[cloud.genus] || "☁️";
        document.getElementById("result").innerHTML = `
<h2>${icon} ${cloud.genus}</h2>
<table border="1" cellpadding="6">
<tr>
<td><b>Species</b></td>
<td>${cloud.species}</td>
</tr>
<tr>
<td><b>Confidence</b></td>
<td>${cloud.confidence}%</td>
</tr>
<tr>
<td><b>Weather</b></td>
<td>${cloud.weather}</td>
</tr>
<tr>
<td><b>Reason</b></td>
<td>${cloud.reason}</td>
</tr>
</table>
`;
    };
    reader.readAsDataURL(file);
};
</script></body>

</html>
